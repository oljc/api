pre-commit:
  commands:
    check:
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    check:
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {push_files}
